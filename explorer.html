<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contract Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/@shadcn/ui@latest/dist/shadcn-ui.min.css" rel="stylesheet">
    <style>
        [x-cloak] {
            display: none !important;
        }
    </style>
</head>

<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-4">
        <!-- Header -->
        <div class="mb-4">
            <h1 class="text-2xl font-bold text-gray-800">Contract Explorer</h1>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
            <!-- Left Column -->
            <div class="lg:col-span-1 space-y-4">
                <!-- Wallet Connection Card -->
                <div class="bg-white rounded-lg shadow-sm p-4">
                    <h2 class="text-lg font-semibold text-gray-800 mb-3">Kết nối ví</h2>
                    <div class="space-y-3">
                        <div class="flex space-x-2">
                            <button id="metamaskBtn"
                                class="flex-1 bg-blue-500 hover:bg-blue-600 text-white px-3 py-2 text-sm rounded transition-colors">
                                MetaMask
                            </button>
                            <button id="hardhatBtn"
                                class="flex-1 bg-green-500 hover:bg-green-600 text-white px-3 py-2 text-sm rounded transition-colors">
                                Hardhat
                            </button>
                        </div>

                        <!-- Network Selection -->
                        <div class="mt-3">
                            <label class="block text-xs font-medium text-gray-700 mb-1">Chọn mạng</label>
                            <div class="flex space-x-2">
                                <select id="networkSelect"
                                    class="flex-1 px-2 py-1 text-sm border border-gray-300 rounded focus:outline-none focus:ring-1 focus:ring-blue-500">
                                    <option value="hardhat">Hardhat (Local)</option>
                                    <option value="mainnet">Ethereum Mainnet</option>
                                    <option value="goerli">Goerli Testnet</option>
                                    <option value="sepolia">Sepolia Testnet</option>
                                    <option value="polygon">Polygon Mainnet</option>
                                    <option value="mumbai">Mumbai Testnet</option>
                                    <option value="bsc">BSC Mainnet</option>
                                    <option value="bscTestnet">BSC Testnet</option>
                                    <option value="seiMainnet">Sei Mainnet</option>
                                    <option value="seiTestnet">Sei Testnet</option>
                                </select>
                                <button id="switchNetworkBtn"
                                    class="bg-purple-500 hover:bg-purple-600 text-white px-3 py-1 text-sm rounded transition-colors">
                                    Chuyển mạng
                                </button>
                            </div>
                        </div>

                        <div id="hardhatKeyInput" class="hidden">
                            <label class="block text-xs font-medium text-gray-700 mb-1">Private Key</label>
                            <div class="flex space-x-2">
                                <input type="text" id="privateKey"
                                    class="flex-1 px-2 py-1 text-sm border border-gray-300 rounded focus:outline-none focus:ring-1 focus:ring-blue-500"
                                    placeholder="0x...">
                                <button id="connectHardhat"
                                    class="bg-green-500 hover:bg-green-600 text-white px-3 py-1 text-sm rounded transition-colors">
                                    Kết nối
                                </button>
                            </div>
                        </div>

                        <div id="hardhatAccounts" class="hidden">
                            <label class="block text-xs font-medium text-gray-700 mb-1">Danh sách ví Hardhat</label>
                            <div class="flex space-x-2">
                                <select id="hardhatAccountSelect"
                                    class="flex-1 px-2 py-1 text-sm border border-gray-300 rounded focus:outline-none focus:ring-1 focus:ring-blue-500">
                                    <option value="">-- Chọn ví --</option>
                                </select>
                            </div>
                        </div>

                        <div id="walletInfo" class="hidden bg-gray-50 p-3 rounded text-sm">
                            <div class="space-y-2">
                                <div class="flex justify-between items-center">
                                    <div>
                                        <span class="text-gray-600">Địa chỉ: </span>
                                        <span id="walletAddress" class="font-mono text-xs"></span>
                                    </div>
                                    <div>
                                        <span class="text-gray-600">Loại ví: </span>
                                        <span id="walletType" class="font-medium text-xs"></span>
                                    </div>
                                </div>
                                <div class="flex justify-between items-center">
                                    <div>
                                        <span class="text-gray-600">Số dư: </span>
                                        <span id="walletBalance" class="font-mono text-xs"></span>
                                    </div>
                                    <div>
                                        <span class="text-gray-600">Mạng: </span>
                                        <span id="walletNetwork" class="font-medium text-xs"></span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Contract Selection Card -->
                <div class="bg-white rounded-lg shadow-sm p-4">
                    <h2 class="text-lg font-semibold text-gray-800 mb-3">Chọn Contract</h2>
                    <div class="space-y-3">
                        <div>
                            <label class="block text-xs font-medium text-gray-700 mb-1">Contract</label>
                            <div class="flex space-x-2">
                                <select id="contractSelect"
                                    class="flex-1 px-2 py-1 text-sm border border-gray-300 rounded focus:outline-none focus:ring-1 focus:ring-blue-500">
                                    <option value="">-- Chọn contract --</option>
                                </select>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-xs font-medium text-gray-700 mb-1">Lọc tên</label>
                                <input type="text" id="abiFilter"
                                    class="w-full px-2 py-1 text-sm border border-gray-300 rounded focus:outline-none focus:ring-1 focus:ring-blue-500"
                                    placeholder="Tên contract...">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-gray-700 mb-1">Loại ABI</label>
                                <select id="abiType"
                                    class="w-full px-2 py-1 text-sm border border-gray-300 rounded focus:outline-none focus:ring-1 focus:ring-blue-500">
                                    <option value="">Tất cả</option>
                                    <option value="function">Functions</option>
                                    <option value="event">Events</option>
                                    <option value="error">Errors</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Contract Configuration Card -->
                <div class="bg-white rounded-lg shadow-sm p-4">
                    <h2 class="text-lg font-semibold text-gray-800 mb-3">Cấu hình Contract</h2>
                    <div class="space-y-3">
                        <div>
                            <label class="block text-xs font-medium text-gray-700 mb-1">Địa chỉ Contract</label>
                            <input type="text" id="contractAddress"
                                class="w-full px-2 py-1 text-sm border border-gray-300 rounded focus:outline-none focus:ring-1 focus:ring-blue-500"
                                placeholder="0x...">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-700 mb-1">ABI</label>
                            <div class="relative">
                                <textarea id="contractABI" rows="3"
                                    class="w-full px-2 py-1 text-sm border border-gray-300 rounded focus:outline-none focus:ring-1 focus:ring-blue-500"
                                    placeholder="Paste ABI here..."></textarea>
                                <div id="abiInfo" class="absolute top-0 right-0 p-1 text-xs text-gray-500 hidden">
                                    <span id="abiSource"></span>
                                    <span id="abiTimestamp"></span>
                                </div>
                            </div>
                        </div>
                        <div class="flex space-x-2">
                            <button id="loadContract"
                                class="flex-1 bg-green-500 hover:bg-green-600 text-white px-3 py-2 text-sm rounded transition-colors">
                                Tải Contract
                            </button>
                            <button id="saveContract"
                                class="bg-blue-500 hover:bg-blue-600 text-white px-3 py-2 text-sm rounded transition-colors">
                                Lưu
                            </button>
                            <button id="copyABI"
                                class="bg-purple-500 hover:bg-purple-600 text-white px-3 py-2 text-sm rounded transition-colors">
                                Copy ABI
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Contract History Card -->
                <div class="bg-white rounded-lg shadow-sm p-4">
                    <h2 class="text-lg font-semibold text-gray-800 mb-3">Lịch sử Contract</h2>
                    <div class="space-y-3">
                        <div id="contractHistory" class="space-y-2 max-h-60 overflow-y-auto">
                            <!-- Lịch sử contract sẽ được hiển thị ở đây -->
                            <div class="text-center text-gray-500 text-sm py-4">Đang tải lịch sử...</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Column -->
            <div class="lg:col-span-2">
                <!-- Contract Functions Card -->
                <div class="bg-white rounded-lg shadow-sm p-4">
                    <div class="border-b border-gray-200 mb-4">
                        <nav class="flex space-x-4" aria-label="Tabs">
                            <button id="readTab"
                                class="px-3 py-2 text-sm font-medium text-blue-600 border-b-2 border-blue-600">
                                Read Functions
                            </button>
                            <button id="writeTab"
                                class="px-3 py-2 text-sm font-medium text-gray-500 hover:text-gray-700 hover:border-gray-300">
                                Write Functions
                            </button>
                        </nav>
                    </div>

                    <div id="readFunctions" class="space-y-3">
                        <!-- Functions will be dynamically added here -->
                    </div>

                    <div id="writeFunctions" class="hidden space-y-3">
                        <!-- Functions will be dynamically added here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let provider;
        let signer;
        let contract;
        let currentABI = [];
        let walletType = null;
        let artifacts = {};
        let lastLoadedArtifact = null;
        let contractHistory = [];

        // Thêm biến để lưu thông tin mạng
        let currentNetwork = 'hardhat';
        const networkConfigs = {
            hardhat: {
                rpcUrl: 'http://127.0.0.1:8545',
                chainId: 31337,
                name: 'Hardhat Local',
                currency: 'ETH'
            },
            mainnet: {
                rpcUrl: 'https://mainnet.infura.io/v3/',
                chainId: 1,
                name: 'Ethereum Mainnet',
                currency: 'ETH'
            },
            goerli: {
                rpcUrl: 'https://goerli.infura.io/v3/',
                chainId: 5,
                name: 'Goerli Testnet',
                currency: 'ETH'
            },
            sepolia: {
                rpcUrl: 'https://sepolia.infura.io/v3/',
                chainId: 11155111,
                name: 'Sepolia Testnet',
                currency: 'ETH'
            },
            polygon: {
                rpcUrl: 'https://polygon-rpc.com',
                chainId: 137,
                name: 'Polygon Mainnet',
                currency: 'MATIC'
            },
            mumbai: {
                rpcUrl: 'https://rpc-mumbai.maticvigil.com',
                chainId: 80001,
                name: 'Mumbai Testnet',
                currency: 'MATIC'
            },
            bsc: {
                rpcUrl: 'https://bsc-dataseed.binance.org',
                chainId: 56,
                name: 'BSC Mainnet',
                currency: 'BNB'
            },
            bscTestnet: {
                rpcUrl: 'https://data-seed-prebsc-1-s1.binance.org:8545',
                chainId: 97,
                name: 'BSC Testnet',
                currency: 'BNB'
            },
            seiMainnet: {
                rpcUrl: 'https://evm-rpc.sei-apis.com',
                chainId: 1329,
                name: 'Sei Mainnet',
                currency: 'SEI',
                blockExplorer: 'https://sei.explorers.guru'
            },
            seiTestnet: {
                rpcUrl: 'https://evm-rpc-testnet.sei-apis.com',
                chainId: 1328,
                name: 'Sei Testnet',
                currency: 'SEI',
                blockExplorer: 'https://sei-testnet.explorers.guru'
            }
        };

        // Thêm hàm format số dư
        function formatBalance(balance, decimals = 4) {
            // Chuyển đổi BigNumber sang số thập phân
            const balanceInEther = ethers.utils.formatEther(balance);

            // Chuyển đổi sang số để format
            const number = parseFloat(balanceInEther);

            // Format số với dấu phân cách hàng nghìn và số thập phân cố định
            return number.toLocaleString('vi-VN', {
                minimumFractionDigits: 2,
                maximumFractionDigits: decimals
            });
        }

        // Hàm tự động tải khi vào trang
        async function initializePage() {
            try {
                // Tự động tải danh sách ví Hardhat
                const hardhatProvider = new ethers.providers.JsonRpcProvider("http://127.0.0.1:8545");
                const accounts = await hardhatProvider.listAccounts();

                const select = document.getElementById('hardhatAccountSelect');
                select.innerHTML = '<option value="">-- Chọn ví --</option>';

                accounts.forEach((account, index) => {
                    const option = document.createElement('option');
                    option.value = account;
                    option.textContent = `Ví ${index + 1}: ${account.slice(0, 6)}...${account.slice(-4)}`;
                    select.appendChild(option);
                });

                // Tự động kết nối với ví đầu tiên
                if (accounts.length > 0) {
                    await connectHardhatAccount(accounts[0]);
                }

                // Tự động tải artifacts
                const response = await fetch('/api/artifacts');
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || 'Lỗi tải artifacts');
                }

                const data = await response.json();
                if (!data || Object.keys(data).length === 0) {
                    throw new Error('Không tìm thấy artifacts nào');
                }

                artifacts = data;
                lastLoadedArtifact = new Date().toISOString();

                // Populate contract select
                const contractSelect = document.getElementById('contractSelect');
                contractSelect.innerHTML = '<option value="">-- Chọn contract --</option>';

                Object.entries(artifacts).forEach(([contractName, artifact]) => {
                    if (artifact && artifact.abi && Array.isArray(artifact.abi)) {
                        const option = document.createElement('option');
                        option.value = contractName;
                        option.textContent = `${contractName} (${artifact.abi.length} items)`;
                        contractSelect.appendChild(option);
                    }
                });

                // Hiển thị thông tin về ABI
                document.getElementById('abiInfo').classList.remove('hidden');
                document.getElementById('abiSource').textContent = 'ABI từ artifacts';
                document.getElementById('abiTimestamp').textContent = ` (Tải lúc: ${new Date(lastLoadedArtifact).toLocaleTimeString()})`;

                // Tải lịch sử contract
                await loadContractHistory();

            } catch (error) {
                console.error('Lỗi khởi tạo trang:', error);
                alert('Lỗi khởi tạo trang: ' + error.message);
            }
        }

        // Hàm tải lịch sử contract
        async function loadContractHistory() {
            try {
                const response = await fetch('/api/contract-history');
                if (!response.ok) {
                    throw new Error('Lỗi tải lịch sử contract');
                }

                contractHistory = await response.json();
                displayContractHistory();
            } catch (error) {
                console.error('Lỗi tải lịch sử contract:', error);
                document.getElementById('contractHistory').innerHTML = `
                    <div class="text-center text-red-500 text-sm py-4">
                        Lỗi tải lịch sử: ${error.message}
                    </div>
                `;
            }
        }

        // Hàm hiển thị lịch sử contract
        function displayContractHistory() {
            const historyContainer = document.getElementById('contractHistory');

            if (contractHistory.length === 0) {
                historyContainer.innerHTML = `
                    <div class="text-center text-gray-500 text-sm py-4">
                        Chưa có lịch sử contract nào
                    </div>
                `;
                return;
            }

            let html = '';

            contractHistory.forEach((item, index) => {
                const lastUsed = new Date(item.lastUsed).toLocaleString();
                html += `
                    <div class="bg-gray-50 p-2 rounded hover:bg-gray-100 cursor-pointer transition-colors" 
                         data-index="${index}" onclick="loadContractFromHistory(${index})">
                        <div class="font-medium text-sm">${item.name}</div>
                        <div class="text-xs text-gray-500 font-mono">${item.address}</div>
                    </div>
                `;
            });

            historyContainer.innerHTML = html;
        }

        // Contract selection change
        document.getElementById('contractSelect').addEventListener('change', (event) => {
            const contractName = event.target.value;
            if (contractName && artifacts[contractName] && artifacts[contractName].abi) {
                const artifact = artifacts[contractName];
                document.getElementById('contractABI').value = JSON.stringify(artifact.abi, null, 2);

                // Hiển thị thông tin về ABI
                document.getElementById('abiInfo').classList.remove('hidden');
                document.getElementById('abiSource').textContent = `ABI từ artifacts (${contractName})`;
                document.getElementById('abiTimestamp').textContent = ` (Tải lúc: ${new Date(artifact.timestamp).toLocaleTimeString()})`;
            } else {
                // Ẩn thông tin ABI nếu không có contract được chọn
                document.getElementById('abiInfo').classList.add('hidden');
                document.getElementById('contractABI').value = '';
            }
        });

        // Khi người dùng paste ABI thủ công
        document.getElementById('contractABI').addEventListener('input', () => {
            // Ẩn thông tin ABI khi người dùng thay đổi nội dung
            document.getElementById('abiInfo').classList.add('hidden');
        });

        // Tab switching
        document.getElementById('readTab').addEventListener('click', () => {
            document.getElementById('readTab').classList.add('text-blue-600', 'border-b-2', 'border-blue-600');
            document.getElementById('writeTab').classList.remove('text-blue-600', 'border-b-2', 'border-blue-600');
            document.getElementById('readFunctions').classList.remove('hidden');
            document.getElementById('writeFunctions').classList.add('hidden');
        });

        document.getElementById('writeTab').addEventListener('click', () => {
            document.getElementById('writeTab').classList.add('text-blue-600', 'border-b-2', 'border-blue-600');
            document.getElementById('readTab').classList.remove('text-blue-600', 'border-b-2', 'border-blue-600');
            document.getElementById('writeFunctions').classList.remove('hidden');
            document.getElementById('readFunctions').classList.add('hidden');
        });

        // Thêm event listener cho nút chuyển mạng
        document.getElementById('switchNetworkBtn').addEventListener('click', async () => {
            try {
                const selectedNetwork = document.getElementById('networkSelect').value;
                await switchNetwork(selectedNetwork);
                currentNetwork = selectedNetwork;

                // Cập nhật provider nếu đang sử dụng MetaMask
                if (walletType === 'metamask') {
                    provider = new ethers.providers.Web3Provider(window.ethereum);
                    signer = provider.getSigner();
                }

                alert(`Đã chuyển sang mạng ${networkConfigs[selectedNetwork].name}`);
            } catch (error) {
                console.error('Lỗi chuyển mạng:', error);
                alert('Lỗi chuyển mạng: ' + error.message);
            }
        });

        // Cập nhật hàm kết nối MetaMask
        document.getElementById('metamaskBtn').addEventListener('click', async () => {
            try {
                if (typeof window.ethereum !== 'undefined') {
                    provider = new ethers.providers.Web3Provider(window.ethereum);
                    await provider.send("eth_requestAccounts", []);
                    signer = provider.getSigner();
                    const address = await signer.getAddress();

                    // Lấy chainId hiện tại
                    const network = await provider.getNetwork();
                    const currentChainId = network.chainId;

                    // Tìm mạng tương ứng
                    const selectedNetwork = Object.entries(networkConfigs).find(
                        ([_, config]) => config.chainId === currentChainId
                    )?.[0] || 'mainnet';

                    // Cập nhật dropdown
                    document.getElementById('networkSelect').value = selectedNetwork;
                    currentNetwork = selectedNetwork;

                    // Format địa chỉ
                    const formattedAddress = `${address.slice(0, 6)}...${address.slice(-4)}`;

                    // Lấy số dư
                    const balance = await provider.getBalance(address);
                    const formattedBalance = formatBalance(balance);

                    // Update UI
                    document.getElementById('walletInfo').classList.remove('hidden');
                    document.getElementById('walletAddress').textContent = formattedAddress;
                    document.getElementById('walletType').textContent = 'MetaMask';
                    document.getElementById('walletBalance').textContent = `${formattedBalance} ${networkConfigs[selectedNetwork].currency}`;
                    document.getElementById('walletNetwork').textContent = networkConfigs[selectedNetwork].name;

                    // Update buttons
                    document.getElementById('metamaskBtn').classList.add('bg-blue-700');
                    document.getElementById('hardhatBtn').classList.remove('bg-green-700');

                    walletType = 'metamask';

                    // Cập nhật số dư mỗi 10 giây
                    setInterval(async () => {
                        const newBalance = await provider.getBalance(address);
                        const newFormattedBalance = formatBalance(newBalance);
                        document.getElementById('walletBalance').textContent = `${newFormattedBalance} ${networkConfigs[selectedNetwork].currency}`;
                    }, 10000);
                } else {
                    alert('Vui lòng cài đặt MetaMask!');
                }
            } catch (error) {
                console.error('Lỗi kết nối MetaMask:', error);
                alert('Lỗi kết nối MetaMask: ' + error.message);
            }
        });

        // Cập nhật hàm kết nối Hardhat
        document.getElementById('hardhatBtn').addEventListener('click', () => {
            document.getElementById('hardhatAccounts').classList.remove('hidden');
            document.getElementById('metamaskBtn').classList.remove('bg-blue-700');
            document.getElementById('hardhatBtn').classList.add('bg-green-700');

            // Đặt mạng về Hardhat
            document.getElementById('networkSelect').value = 'hardhat';
            currentNetwork = 'hardhat';
        });

        // Thêm sự kiện khi chọn ví từ dropdown
        document.getElementById('hardhatAccountSelect').addEventListener('change', async (event) => {
            const selectedAddress = event.target.value;
            if (selectedAddress) {
                await connectHardhatAccount(selectedAddress);
            }
        });

        // Hàm kết nối với ví Hardhat
        async function connectHardhatAccount(address) {
            try {
                // Connect to Hardhat
                provider = new ethers.providers.JsonRpcProvider("http://127.0.0.1:8545");
                signer = provider.getSigner(address);
                const connectedAddress = await signer.getAddress();

                // Format địa chỉ
                const formattedAddress = `${connectedAddress.slice(0, 6)}...${connectedAddress.slice(-4)}`;

                // Lấy số dư
                const balance = await provider.getBalance(connectedAddress);
                const formattedBalance = formatBalance(balance);

                // Update UI
                document.getElementById('walletInfo').classList.remove('hidden');
                document.getElementById('walletAddress').textContent = formattedAddress;
                document.getElementById('walletType').textContent = 'Hardhat';
                document.getElementById('walletBalance').textContent = `${formattedBalance} ETH`;
                document.getElementById('walletNetwork').textContent = 'Hardhat Local';

                walletType = 'hardhat';

                // Cập nhật số dư mỗi 10 giây
                setInterval(async () => {
                    const newBalance = await provider.getBalance(connectedAddress);
                    const newFormattedBalance = formatBalance(newBalance);
                    document.getElementById('walletBalance').textContent = `${newFormattedBalance} ETH`;
                }, 10000);
            } catch (error) {
                console.error('Lỗi kết nối Hardhat:', error);
                alert('Lỗi kết nối Hardhat: ' + error.message);
            }
        }

        // Load contract
        document.getElementById('loadContract').addEventListener('click', async () => {
            try {
                const address = document.getElementById('contractAddress').value;
                const abiText = document.getElementById('contractABI').value;

                if (!ethers.utils.isAddress(address)) {
                    throw new Error('Địa chỉ contract không hợp lệ');
                }

                try {
                    currentABI = JSON.parse(abiText);
                } catch (error) {
                    throw new Error('ABI không hợp lệ');
                }

                if (!signer) {
                    throw new Error('Vui lòng kết nối ví trước khi tải contract');
                }

                contract = new ethers.Contract(address, currentABI, signer);

                // Clear existing functions
                document.getElementById('readFunctions').innerHTML = '';
                document.getElementById('writeFunctions').innerHTML = '';

                // Add functions to UI
                currentABI.forEach(item => {
                    if (item.type === 'function') {
                        const functionElement = createFunctionElement(item);
                        if (item.stateMutability === 'view' || item.stateMutability === 'pure') {
                            document.getElementById('readFunctions').appendChild(functionElement);
                        } else {
                            document.getElementById('writeFunctions').appendChild(functionElement);
                        }
                    }
                });

                alert('Contract đã được tải thành công!');
            } catch (error) {
                console.error('Lỗi tải contract:', error);
                alert('Lỗi tải contract: ' + error.message);
            }
        });

        function createFunctionElement(func) {
            const div = document.createElement('div');
            div.className = 'bg-gray-50 p-3 rounded-lg mb-2';

            // Header với tên function và nút thu gọn
            const header = document.createElement('div');
            header.className = 'flex items-center justify-between cursor-pointer hover:bg-gray-100 p-2 rounded transition-colors';

            const functionName = document.createElement('h3');
            functionName.className = 'text-sm font-medium text-gray-900';
            functionName.textContent = func.name;

            const toggleButton = document.createElement('button');
            toggleButton.className = 'text-gray-500 hover:text-gray-700';
            toggleButton.innerHTML = '<svg class="w-4 h-4 transform rotate-180 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>';

            header.appendChild(functionName);
            header.appendChild(toggleButton);

            // Container cho nội dung
            const content = document.createElement('div');
            content.className = 'mt-2 space-y-3';
            content.style.display = 'none';

            // Inputs container
            const inputs = document.createElement('div');
            inputs.className = 'space-y-2';

            func.inputs.forEach((input, index) => {
                const inputGroup = document.createElement('div');
                inputGroup.className = 'flex items-center space-x-2';

                const label = document.createElement('label');
                label.className = 'text-xs text-gray-600 w-1/3';
                label.textContent = input.name || `param${index}`;

                const inputField = document.createElement('input');
                inputField.className = 'flex-1 px-2 py-1 text-sm border border-gray-300 rounded focus:outline-none focus:ring-1 focus:ring-blue-500';
                inputField.type = 'text';
                inputField.placeholder = input.type;

                inputGroup.appendChild(label);
                inputGroup.appendChild(inputField);
                inputs.appendChild(inputGroup);
            });

            // Button container
            const buttonContainer = document.createElement('div');
            buttonContainer.className = 'flex justify-end';

            const button = document.createElement('button');
            button.className = 'bg-blue-500 hover:bg-blue-600 text-white px-3 py-1 text-sm rounded transition-colors';
            button.textContent = 'Gọi hàm';

            buttonContainer.appendChild(button);

            // Result container
            const result = document.createElement('div');
            result.className = 'mt-2 p-2 bg-gray-100 rounded text-xs hidden';

            // Thêm sự kiện click cho header để thu gọn/mở rộng
            header.addEventListener('click', () => {
                const isCollapsed = content.style.display === 'none';
                content.style.display = isCollapsed ? 'block' : 'none';
                toggleButton.querySelector('svg').style.transform = isCollapsed ? 'rotate(0deg)' : 'rotate(180deg)';
            });

            button.addEventListener('click', async () => {
                try {
                    button.disabled = true;
                    button.textContent = 'Đang xử lý...';
                    button.classList.add('opacity-50');

                    const inputValues = Array.from(inputs.querySelectorAll('input')).map(input => input.value);
                    const tx = await contract[func.name](...inputValues);

                    if (func.stateMutability === 'view' || func.stateMutability === 'pure') {
                        let formattedResult = '';

                        if (Array.isArray(tx)) {
                            formattedResult = formatArrayResult(tx);
                        } else if (typeof tx === 'object' && tx !== null) {
                            formattedResult = formatObjectResult(tx);
                        } else {
                            formattedResult = formatSimpleResult(tx);
                        }

                        result.innerHTML = `
                            <div class="font-medium text-green-600 mb-1">Kết quả:</div>
                            <div class="bg-white p-2 rounded border border-gray-200">
                                ${formattedResult}
                            </div>
                        `;
                    } else {
                        result.innerHTML = `
                            <div class="font-medium text-blue-600 mb-1">Transaction hash:</div>
                            <div class="font-mono break-all bg-white p-2 rounded border border-gray-200">${tx.hash}</div>
                            <div class="mt-1 text-gray-500">Đang chờ xác nhận...</div>
                        `;

                        await tx.wait();
                        result.innerHTML += `
                            <div class="mt-1 text-green-600 font-medium">✓ Transaction đã được xác nhận!</div>
                            <div class="mt-1 text-xs text-gray-500">
                                Block: ${tx.blockNumber} | Gas used: ${tx.gasLimit.toString()}
                            </div>
                        `;
                    }

                    result.classList.remove('hidden');
                } catch (error) {
                    result.innerHTML = `
                        <div class="font-medium text-red-600 mb-1">Lỗi:</div>
                        <div class="text-red-500 bg-white p-2 rounded border border-red-200">${error.message}</div>
                    `;
                    result.classList.remove('hidden');
                } finally {
                    button.disabled = false;
                    button.textContent = 'Gọi hàm';
                    button.classList.remove('opacity-50');
                }
            });

            content.appendChild(inputs);
            content.appendChild(buttonContainer);
            content.appendChild(result);

            div.appendChild(header);
            div.appendChild(content);

            return div;
        }

        // Hàm format kết quả dạng mảng
        function formatArrayResult(array) {
            if (array.length === 0) return '<div class="text-gray-500">Mảng rỗng</div>';

            let html = '<div class="space-y-1">';
            array.forEach((item, index) => {
                if (typeof item === 'object' && item !== null) {
                    html += `<div class="pl-2 border-l-2 border-gray-300">
                        <span class="text-gray-500">[${index}]:</span> ${formatObjectResult(item)}
                    </div>`;
                } else {
                    html += `<div class="pl-2 border-l-2 border-gray-300">
                        <span class="text-gray-500">[${index}]:</span> ${formatSimpleResult(item)}
                    </div>`;
                }
            });
            html += '</div>';
            return html;
        }

        // Hàm format kết quả dạng object
        function formatObjectResult(obj) {
            if (obj === null) return '<span class="text-gray-500">null</span>';

            // Kiểm tra nếu là BigNumber
            if (obj._hex !== undefined) {
                return `<span class="font-mono">${obj.toString()}</span>`;
            }

            let html = '<div class="space-y-1">';
            for (const [key, value] of Object.entries(obj)) {
                if (typeof value === 'object' && value !== null) {
                    html += `<div class="pl-2 border-l-2 border-gray-300">
                        <span class="text-gray-500">${key}:</span> ${formatObjectResult(value)}
                    </div>`;
                } else {
                    html += `<div class="pl-2 border-l-2 border-gray-300">
                        <span class="text-gray-500">${key}:</span> ${formatSimpleResult(value)}
                    </div>`;
                }
            }
            html += '</div>';
            return html;
        }

        // Hàm format kết quả đơn giản
        function formatSimpleResult(value) {
            if (value === null) return '<span class="text-gray-500">null</span>';
            if (value === undefined) return '<span class="text-gray-500">undefined</span>';
            if (typeof value === 'boolean') return `<span class="font-medium">${value ? 'true' : 'false'}</span>`;
            if (typeof value === 'number') return `<span class="font-mono">${value}</span>`;
            if (typeof value === 'string') {
                // Kiểm tra nếu là địa chỉ Ethereum
                if (value.startsWith('0x') && value.length === 42) {
                    return `<span class="font-mono">${value.slice(0, 6)}...${value.slice(-4)}</span>`;
                }
                return `<span class="font-mono">"${value}"</span>`;
            }
            return `<span class="font-mono">${value}</span>`;
        }

        // Gọi hàm khởi tạo khi trang được tải
        document.addEventListener('DOMContentLoaded', initializePage);

        // Hàm tải contract từ lịch sử
        window.loadContractFromHistory = function (index) {
            const item = contractHistory[index];
            if (!item) return;

            document.getElementById('contractAddress').value = item.address;
            document.getElementById('contractABI').value = JSON.stringify(item.abi, null, 2);

            // Tự động tải contract
            document.getElementById('loadContract').click();
        };

        // Hàm lưu contract vào lịch sử
        async function saveContractToHistory() {
            try {
                const address = document.getElementById('contractAddress').value;
                const abiText = document.getElementById('contractABI').value;

                if (!ethers.utils.isAddress(address)) {
                    throw new Error('Địa chỉ contract không hợp lệ');
                }

                let abi;
                try {
                    abi = JSON.parse(abiText);
                } catch (error) {
                    throw new Error('ABI không hợp lệ');
                }

                // Lấy tên contract từ select nếu có
                const contractSelect = document.getElementById('contractSelect');
                const contractName = contractSelect.value;

                const response = await fetch('/api/contract-history', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        address,
                        abi,
                        name: contractName ? `${contractName} (${address.slice(0, 6)}...${address.slice(-4)})` : undefined
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || 'Lỗi lưu lịch sử');
                }

                // Tải lại lịch sử
                await loadContractHistory();

                alert('Đã lưu contract vào lịch sử!');
            } catch (error) {
                console.error('Lỗi lưu lịch sử:', error);
                alert('Lỗi lưu lịch sử: ' + error.message);
            }
        }

        // Lưu contract vào lịch sử
        document.getElementById('saveContract').addEventListener('click', saveContractToHistory);

        // Thêm sự kiện copy ABI
        document.getElementById('copyABI').addEventListener('click', async () => {
            try {
                const abiText = document.getElementById('contractABI').value;
                if (!abiText) {
                    throw new Error('Không có ABI để copy');
                }

                await navigator.clipboard.writeText(abiText);
                alert('Đã copy ABI vào clipboard!');
            } catch (error) {
                console.error('Lỗi copy ABI:', error);
                alert('Lỗi copy ABI: ' + error.message);
            }
        });

        // Hàm chuyển đổi mạng
        async function switchNetwork(network) {
            try {
                if (typeof window.ethereum !== 'undefined') {
                    const config = networkConfigs[network];

                    // Kiểm tra xem mạng có phải là Sei không
                    const isSeiNetwork = network.startsWith('sei');

                    if (isSeiNetwork) {
                        // Xử lý đặc biệt cho mạng Sei
                        try {
                            await window.ethereum.request({
                                method: 'wallet_addEthereumChain',
                                params: [{
                                    chainId: `0x${config.chainId.toString(16)}`,
                                    chainName: config.name,
                                    nativeCurrency: {
                                        name: config.currency,
                                        symbol: config.currency,
                                        decimals: 18
                                    },
                                    rpcUrls: [config.rpcUrl],
                                    blockExplorerUrls: [config.blockExplorer]
                                }]
                            });
                        } catch (addError) {
                            console.error('Lỗi thêm mạng Sei:', addError);

                            // Nếu mạng đã tồn tại, thử chuyển sang mạng đó
                            if (addError.code === 4001) {
                                await window.ethereum.request({
                                    method: 'wallet_switchEthereumChain',
                                    params: [{ chainId: `0x${config.chainId.toString(16)}` }],
                                });
                            } else {
                                throw addError;
                            }
                        }
                    } else {
                        // Xử lý cho các mạng EVM thông thường
                        try {
                            await window.ethereum.request({
                                method: 'wallet_switchEthereumChain',
                                params: [{ chainId: `0x${config.chainId.toString(16)}` }],
                            });
                        } catch (switchError) {
                            if (switchError.code === 4902) {
                                // Nếu chain chưa được thêm vào MetaMask
                                await window.ethereum.request({
                                    method: 'wallet_addEthereumChain',
                                    params: [{
                                        chainId: `0x${config.chainId.toString(16)}`,
                                        chainName: config.name,
                                        nativeCurrency: {
                                            name: config.currency,
                                            symbol: config.currency,
                                            decimals: 18
                                        },
                                        rpcUrls: [config.rpcUrl],
                                        blockExplorerUrls: config.blockExplorer ? [config.blockExplorer] : null
                                    }]
                                });
                            } else {
                                throw switchError;
                            }
                        }
                    }
                } else {
                    throw new Error('MetaMask không được cài đặt hoặc không khả dụng');
                }
            } catch (error) {
                console.error('Lỗi chi tiết khi chuyển mạng:', error);

                // Hiển thị thông báo lỗi chi tiết hơn
                let errorMessage = 'Lỗi chuyển mạng: ';

                if (error.code === 4001) {
                    errorMessage += 'Người dùng đã hủy yêu cầu';
                } else if (error.code === -32002) {
                    errorMessage += 'Đang có yêu cầu chuyển mạng đang chờ xử lý';
                } else if (error.code === -32603) {
                    errorMessage += 'Lỗi nội bộ của MetaMask';
                } else if (error.message) {
                    errorMessage += error.message;
                } else {
                    errorMessage += 'Lỗi không xác định';
                }

                throw new Error(errorMessage);
            }
        }
    </script>
